name: Build hamid_taneel APK

# Put the zip (hamid_taneel-source.zip) in the root of the repository and this file at
# .github/workflows/build-apk.yml. Every push of the zip, or a manual run, unzips it and builds the app.

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Name of the zip file in the repository root"
        required: false
        default: "hamid_taneel-source.zip"
        type: string
  push:
    paths:
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZIP_NAME: ${{ inputs.zip_name || 'hamid_taneel-source.zip' }}
      RUST_TOOLCHAIN: "stable"
      GO_VERSION: "1.26"

    steps:
    - name: Checkout (only the zip)
      uses: actions/checkout@v4

    - name: Unzip the project
      run: |
        test -f "$ZIP_NAME" || { echo "::error::$ZIP_NAME not found in the repository root"; ls -la; exit 1; }
        mkdir -p "$RUNNER_TEMP/src"
        unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/src"
        APP=$(find "$RUNNER_TEMP/src" -maxdepth 3 -type d -name V2rayNG | head -1)
        test -n "$APP" || { echo "::error::V2rayNG folder not found in the zip"; exit 1; }
        ROOT=$(dirname "$APP")
        echo "ROOT=$ROOT" >> "$GITHUB_ENV"
        echo "Project root: $ROOT"
        ls "$ROOT"

    # The zip carries the three submodule folders empty, so they are cloned here.
    - name: Fetch the submodules
      run: |
        cd "$ROOT"
        rm -rf AndroidLibXrayLite hev-socks5-tunnel aether
        git clone https://github.com/patterniha/AndroidLibXrayLite AndroidLibXrayLite
        git clone --recurse-submodules https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
        git clone --recurse-submodules --branch main https://github.com/patterniha/Aether.git aether
        echo "HEV_SHA=$(git -C hev-socks5-tunnel rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "AETHER_SHA=$(git -C aether rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' "$ROOT/V2rayNG/app/build.gradle.kts"

    - name: Restore cached libhevtun
      id: cache-hev
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ROOT }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.HEV_SHA }}-${{ hashFiles('**/compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-hev.outputs.cache-hit != 'true'
      run: bash "$ROOT/compile-hevtun.sh"

    - name: Save libhevtun
      if: steps.cache-hev.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ROOT }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.HEV_SHA }}-${{ hashFiles('**/compile-hevtun.sh') }}

    - name: Install Rust
      id: rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-aether
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ROOT }}/libs-aether
        key: libaether-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.AETHER_SHA }}-${{ hashFiles('**/compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-aether.outputs.cache-hit != 'true'
      run: bash "$ROOT/compile-aether.sh"

    - name: Save libaether
      if: steps.cache-aether.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ROOT }}/libs-aether
        key: libaether-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.AETHER_SHA }}-${{ hashFiles('**/compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cached Psiphon client
      id: cache-psiphon
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ROOT }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.AETHER_SHA }}-${{ hashFiles('**/compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon.outputs.cache-hit != 'true'
      run: bash "$ROOT/compile-psiphon.sh"

    - name: Save the Psiphon client
      if: steps.cache-psiphon.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ROOT }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.AETHER_SHA }}-${{ hashFiles('**/compile-psiphon.sh') }}

    - name: Restore cached pluggable transport
      id: cache-pt
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ROOT }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.AETHER_SHA }}-${{ hashFiles('**/compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt.outputs.cache-hit != 'true'
      run: bash "$ROOT/compile-pt.sh"

    - name: Save the pluggable transport
      if: steps.cache-pt.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ROOT }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.AETHER_SHA }}-${{ hashFiles('**/compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r "$ROOT/libs" "$ROOT/V2rayNG/app"
        cp -r "$ROOT/libs-aether/." "$ROOT/V2rayNG/app/libs/"
        cp -r "$ROOT/libs-psiphon/." "$ROOT/V2rayNG/app/libs/"
        cp -r "$ROOT/libs-pt/." "$ROOT/V2rayNG/app/libs/"

    - name: Fetch the Psiphon server list
      run: bash "$ROOT/fetch-psiphon-servers.sh"

    - name: Find the libv2ray release tag
      run: |
        cd "$ROOT/AndroidLibXrayLite"
        TAG=$(git describe --tags --abbrev=0)
        echo "libv2ray tag: $TAG"
        echo "CURRENT_TAG=$TAG" >> "$GITHUB_ENV"

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: ${{ env.ROOT }}/V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Signing: uses the repository secrets when they exist, otherwise makes a new key for this run.
    # A new key each run means a new build cannot be installed over an older one; add the secrets
    # APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD, APP_KEYSTORE_ALIAS and APP_KEY_PASSWORD to keep one key.
    - name: Prepare the signing key
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        KS="$RUNNER_TEMP/hamid_taneel.jks"
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$KS"
        else
          KS_PASS="hamidtaneel123"; KEY_PASS="hamidtaneel123"; KS_ALIAS="hamid_taneel"
          keytool -genkeypair -keystore "$KS" -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=hamid_taneel"
        fi
        {
          echo "KS_FILE=$KS"
          echo "KS_PASS=$KS_PASS"
          echo "KS_ALIAS=$KS_ALIAS"
          echo "KEY_PASS=$KEY_PASS"
        } >> "$GITHUB_ENV"

    - name: Build APK
      run: |
        cd "$ROOT/V2rayNG"
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$KS_FILE" \
          -Pandroid.injected.signing.store.password="$KS_PASS" \
          -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASS"

    - name: List the APKs
      run: find "$ROOT/V2rayNG/app/build/outputs/apk" -name '*.apk' -exec ls -la {} \;

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      with:
        name: hamid_taneel-universal
        path: ${{ env.ROOT }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

    - name: Upload per-ABI APKs
      uses: actions/upload-artifact@v4
      with:
        name: hamid_taneel-per-abi
        path: |
          ${{ env.ROOT }}/V2rayNG/app/build/outputs/apk/*/release/*.apk
          !${{ env.ROOT }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
